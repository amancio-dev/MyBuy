<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#040711">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minhas Compras">
<meta name="format-detection" content="telephone=no">
<title>Minhas Compras — Orçamento & Gastos</title>
<style>
  :root {
    --bg-deep: #040711;
    --bg-surface: rgba(15, 23, 42, 0.72);
    --bg-elevated: rgba(30, 41, 59, 0.65);
    --bg-glass: rgba(15, 23, 42, 0.85);
    --border-subtle: rgba(148, 163, 184, 0.12);
    --border-glow: rgba(56, 189, 248, 0.28);
    --primary: #2563eb;
    --primary-glow: #3b82f6;
    --accent: #38bdf8;
    --emerald: #10b981;
    --emerald-soft: rgba(16, 185, 129, 0.14);
    --rose: #f43f5e;
    --rose-soft: rgba(244, 63, 94, 0.14);
    --amber: #f59e0b;
    --amber-soft: rgba(245, 158, 11, 0.14);
    --text-main: #f8fafc;
    --text-sec: #94a3b8;
    --text-muted: #64748b;
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100dvh;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overscroll-behavior-y: none;
    font-variant-numeric: tabular-nums;
  }

  body {
    background-image: 
      radial-gradient(circle at 15% -5%, rgba(37, 99, 235, 0.22) 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
    background-attachment: fixed;
  }

  button, input, select, textarea {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    outline: none;
  }

  button { cursor: pointer; user-select: none; }
  ul, ol { list-style: none; }

  /* ══════════ SHELL MOBILE RESPONSIVO ══════════ */
  .app-shell {
    width: 100%;
    max-width: 460px;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-bottom: calc(96px + var(--safe-bottom));
  }

  @media (min-width: 500px) {
    body {
      padding: 16px 0;
    }
    .app-shell {
      min-height: calc(100dvh - 32px);
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 80px -15px rgba(0, 0, 0, 0.85);
      background: rgba(4, 7, 17, 0.85);
      overflow: hidden;
    }
  }

  .px-page { padding-left: 16px; padding-right: 16px; }
  @media (min-width: 380px) {
    .px-page { padding-left: 20px; padding-right: 20px; }
  }

  .hidden { display: none !important; }

  /* ══════════ HEADER & SELETOR DE MÊS ══════════ */
  .top-header {
    padding-top: calc(12px + var(--safe-top));
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, rgba(4, 7, 17, 0.95) 65%, rgba(4, 7, 17, 0) 100%);
    backdrop-filter: blur(8px);
    padding-bottom: 8px;
  }

  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .user-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .avatar-circle {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, #2563eb, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.65);
    flex-shrink: 0;
  }

  .user-greeting {
    font-size: 11px;
    color: var(--text-sec);
    font-weight: 500;
  }

  .user-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 13px;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cbd5e1;
    transition: transform 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.92); background: rgba(56, 189, 248, 0.15); }

  /* Seletor de Mês Estilo Cápsula */
  .month-switcher {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 4px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .month-nav-btn {
    width: 34px;
    height: 34px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-sec);
    transition: all 0.15s ease;
  }
  .month-nav-btn:active { background: rgba(255, 255, 255, 0.08); color: #fff; transform: scale(0.92); }

  .month-center {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    text-transform: capitalize;
  }

  .badge-today {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
    background: rgba(56, 189, 248, 0.16);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.3);
  }

  /* ══════════ CARTÃO HERO PRINCIPAL (WALLET) ══════════ */
  .hero-wallet {
    position: relative;
    border-radius: 26px;
    padding: 20px;
    background: 
      radial-gradient(120% 120% at 100% 0%, rgba(56, 189, 248, 0.22) 0%, transparent 55%),
      linear-gradient(145deg, #0f172a 0%, #090f20 100%);
    border: 1px solid rgba(56, 189, 248, 0.22);
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }

  .hero-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-sec);
  }

  .hero-balance {
    margin-top: 6px;
    font-size: clamp(1.75rem, 7.5vw, 2.35rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .progress-wrap {
    margin-top: 16px;
  }
  .progress-track {
    height: 8px;
    width: 100%;
    background: rgba(148, 163, 184, 0.14);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .hero-metrics {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
  }

  .metric-box {
    background: rgba(2, 6, 23, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 14px;
    padding: 8px 10px;
    min-width: 0;
  }
  .metric-box span {
    display: block;
    font-size: 10px;
    color: var(--text-sec);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .metric-box strong {
    display: block;
    margin-top: 2px;
    font-size: clamp(0.75rem, 3.3vw, 0.875rem);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hero-actions {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    box-shadow: 0 10px 24px -8px rgba(37, 99, 235, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .btn-primary:active { transform: scale(0.97); filter: brightness(1.1); }

  .btn-secondary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.18);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn-secondary:active { transform: scale(0.97); background: rgba(51, 65, 85, 0.8); }

  /* ══════════ CARROSSEL DE CARTÕES VISUAIS ══════════ */
  .cards-scroller {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
    scroll-snap-type: x mandatory;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .cards-scroller::-webkit-scrollbar { display: none; }

  .bank-card {
    scroll-snap-align: start;
    flex: 0 0 210px;
    border-radius: 20px;
    padding: 14px 16px;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.16);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 112px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .bank-card:active { transform: scale(0.97); }
  .bank-card-chip {
    width: 26px;
    height: 18px;
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(253, 224, 71, 0.85), rgba(202, 138, 4, 0.85));
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  /* ══════════ CARDS E TRANSAÇÕES ══════════ */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
    margin-bottom: 10px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: #cbd5e1;
    letter-spacing: 0.01em;
  }
  .section-link {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .tx-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tx-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 18px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    transition: transform 0.12s ease, border-color 0.15s ease;
    cursor: pointer;
  }
  .tx-item:active {
    transform: scale(0.985);
    border-color: var(--border-glow);
  }

  .tx-icon {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .tx-info {
    flex: 1;
    min-width: 0;
  }

  .tx-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tx-tags {
    margin-top: 4px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
  }

  .tag-pill {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .tx-right {
    text-align: right;
    flex-shrink: 0;
  }
  .tx-amount {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* ══════════ DOCK DE NAVEGAÇÃO FLUTUANTE ══════════ */
  .dock-wrapper {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(10px + var(--safe-bottom));
    z-index: 30;
    max-width: 430px;
    margin: 0 auto;
    padding: 0 14px;
    pointer-events: none;
  }

  .floating-dock {
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: rgba(11, 18, 36, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 24px;
    padding: 6px 8px;
    box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .dock-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 7px 4px;
    border-radius: 16px;
    color: var(--text-muted);
    transition: all 0.18s ease;
    position: relative;
  }
  .dock-btn span.dock-label {
    font-size: 10px;
    font-weight: 600;
  }
  .dock-btn.is-active {
    color: var(--accent);
    background: rgba(56, 189, 248, 0.1);
  }

  .dock-fab {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    background: linear-gradient(135deg, #2563eb, #0ea5e9);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px -4px rgba(14, 165, 233, 0.7);
    margin: 0 4px;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .dock-fab:active { transform: scale(0.92); }

  /* ══════════ MODAIS BOTTOM SHEET ══════════ */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(2, 6, 23, 0.76);
    backdrop-filter: blur(5px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .sheet-backdrop.is-open { opacity: 1; pointer-events: auto; }

  .sheet-panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    max-width: 460px;
    margin: 0 auto;
    background: #0b1222;
    border-top: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 28px 28px 0 0;
    padding: 10px 18px calc(20px + var(--safe-bottom));
    max-height: 92dvh;
    overflow-y: auto;
    transform: translateY(102%);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.9);
  }
  .sheet-panel.is-open { transform: translateY(0); }

  .sheet-grip {
    width: 38px;
    height: 4px;
    border-radius: 99px;
    background: rgba(148, 163, 184, 0.3);
    margin: 0 auto 12px;
  }

  /* ══════════ SELETORES TOUCH (CATEGORIAS, MÉTODOS, PARCELAS) ══════════ */
  .touch-grid-cats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
  }
  @media (max-width: 350px) {
    .touch-grid-cats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  .cat-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 10px 4px;
    border-radius: 14px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid var(--border-subtle);
    color: var(--text-sec);
    transition: all 0.15s ease;
  }
  .cat-tile span.cat-name {
    font-size: 10px;
    font-weight: 600;
    width: 100%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 2px;
  }
  .cat-tile.is-selected {
    background: rgba(37, 99, 235, 0.2);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 0 1px var(--accent);
  }

  .quick-cents-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 6px 0 2px;
    scrollbar-width: none;
  }
  .quick-cents-row::-webkit-scrollbar { display: none; }

  .quick-pill {
    flex-shrink: 0;
    padding: 6px 11px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.16);
    color: var(--accent);
  }
  .quick-pill:active { transform: scale(0.94); background: rgba(56, 189, 248, 0.18); }

  .field-input {
    width: 100%;
    border-radius: 14px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    background: rgba(15, 23, 42, 0.9);
    padding: 12px 14px;
    font-size: 15px;
    color: var(--text-main);
  }
  .field-input:focus { border-color: var(--accent); }
  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-sec);
    margin-bottom: 6px;
  }

  .chips-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .chips-scroll::-webkit-scrollbar { display: none; }

  .chip-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid var(--border-subtle);
    color: var(--text-sec);
    transition: all 0.15s ease;
  }
  .chip-btn.is-active {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border-color: #3b82f6;
    color: #fff;
  }

  /* Ícones dimensionados */
  .ico-xs { width: 14px; height: 14px; display: inline-block; vertical-align: middle; flex-shrink: 0; }
  .ico-sm { width: 17px; height: 17px; display: inline-block; vertical-align: middle; flex-shrink: 0; }
  .ico-md { width: 20px; height: 20px; display: inline-block; vertical-align: middle; flex-shrink: 0; }
  .ico-lg { width: 22px; height: 22px; display: inline-block; vertical-align: middle; flex-shrink: 0; }

  /* Card genérico */
  .glass-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 22px;
    padding: 16px;
  }

  /* Gráfico de Barras Diário */
  .daily-chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 88px;
    padding-top: 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .daily-chart::-webkit-scrollbar { display: none; }
  .day-col {
    flex: 1;
    min-width: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    justify-content: flex-end;
  }
  .day-bar {
    width: 100%;
    border-radius: 4px 4px 2px 2px;
    background: linear-gradient(180deg, #38bdf8, #2563eb);
    min-height: 3px;
    transition: height 0.3s ease;
  }
  .day-num {
    font-size: 8px;
    color: var(--text-muted);
  }

  .toast-box {
    position: fixed;
    top: calc(12px + var(--safe-top));
    left: 16px;
    right: 16px;
    max-width: 420px;
    margin: 0 auto;
    z-index: 80;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast-item {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 16px;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(56, 189, 248, 0.3);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    font-size: 13px;
    font-weight: 500;
    animation: slideDown 0.25s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-12px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>
